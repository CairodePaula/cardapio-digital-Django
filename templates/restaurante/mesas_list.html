{% extends 'base.html' %}
{% block title %}Mesas{% endblock %}
{% block content %}
<h1>Mesas</h1>

<table>
    <tr><th>Número</th><th>Ação</th></tr>
    {% for mesa in mesas %}
    <tr>
        <td>Mesa {{ mesa.numero }}</td>
        <td>
            <a class="btn" href="{% url 'comandas:abrir_comanda' mesa.id %}">Abrir comanda</a>
        </td>
    </tr>
    {% empty %}
    <tr><td colspan="2">Nenhuma mesa cadastrada ainda.</td></tr>
    {% endfor %}
</table>
{% endblock %}
